# Node & pod health alerts, in standard Prometheus rule-file format.
#
# - The module loads this file into the cluster (kube-prometheus-stack
#   `additionalPrometheusRulesMap`).
# - CI checks it with `promtool check rules` and unit-tests it with
#   `promtool test rules tests/rules/node-pod-health.test.yaml`.
#
# Metric sources:
#   kube_*            kube-state-metrics (state of Kubernetes objects)
#   node_*            node-exporter      (CPU, memory, disk of each node)
#   kubelet_volume_*  kubelet            (persistent volume usage)
#
# Each alert has:  severity (critical = page someone, warning = look today),
#                  summary (one line), description (details) and a runbook link.
groups:
  - name: node-health
    rules:
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is not Ready"
          description: "Node {{ $labels.node }} has reported NotReady for more than 5 minutes. Pods on it may be evicted."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#nodenotready"

      - alert: NodeUnderPressure
        expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} has {{ $labels.condition }}"
          description: "The kubelet on {{ $labels.node }} reports {{ $labels.condition }}; it will start evicting pods."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#nodeunderpressure"

      - alert: NodeHighCPU
        expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} CPU above 90%"
          description: "CPU usage on {{ $labels.instance }} has been {{ $value | humanize }}% for 15 minutes."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#nodehighcpu"

      - alert: NodeHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} memory above 90%"
          description: "Memory usage on {{ $labels.instance }} has been {{ $value | humanize }}% for 15 minutes."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#nodehighmemory"

      - alert: NodeFilesystemAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"}
            * 100 < 10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} below 10% free"
          description: "Only {{ $value | humanize }}% space left on {{ $labels.mountpoint }} ({{ $labels.instance }})."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#nodefilesystemalmostfull"

      - alert: NodeFilesystemFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"}[6h], 24 * 3600) < 0
          and
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"} < 0.4
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24h"
          description: "At the current rate, {{ $labels.mountpoint }} on {{ $labels.instance }} runs out of space within 24 hours."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#nodefilesystemfillingup"

  - name: pod-health
    rules:
      - alert: PodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} keeps restarting (CrashLoopBackOff)."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#podcrashlooping"

      - alert: PodNotRunning
        expr: max by (namespace, pod, phase) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck in {{ $labels.phase }}"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been {{ $labels.phase }} for more than 15 minutes."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#podnotrunning"

      - alert: ContainerOOMKilled
        expr: |
          (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1)
          and ignoring (reason)
          min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
          description: "The container ran out of memory and was restarted. Raise its memory limit or fix the leak."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#containeroomkilled"

      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} is missing replicas"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not had all of its desired replicas available for 15 minutes."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#deploymentreplicasmismatch"

      - alert: PersistentVolumeAlmostFull
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} below 10% free"
          description: "Only {{ $value | humanize }}% space left on PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}."
          runbook_url: "https://github.com/ngems1/terraform-k8s-monitoring-stack/blob/main/docs/RUNBOOKS.md#persistentvolumealmostfull"
